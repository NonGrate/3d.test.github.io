<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Model Viewer AR test</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-bar"><a href="index.html">← Back</a><div><strong>Model Viewer</strong><small id="modelName">Loading model…</small></div></header>
    <model-viewer id="viewer" camera-controls touch-action="pan-y" autoplay ar ar-modes="webxr scene-viewer quick-look" shadow-intensity="1" exposure="1">
      <button class="ar-action" slot="ar-button">View in your space</button>
    </model-viewer>
    <p class="viewer-note">Drag to rotate or pinch to zoom. Tap “View in your space” to request camera access and start AR.</p>
  </main>
  <script>
    const names = { Shiba: 'Shiba', Island: 'Island', Solar_System_Animated_Rigged: 'Solar system' };
    const requested = new URLSearchParams(location.search).get('model');
    const model = names[requested] ? requested : 'Shiba';
    const viewer = document.getElementById('viewer');
    viewer.src = `${model}.glb`;
    viewer.setAttribute('ios-src', `${model}.usdz`);
    viewer.alt = `${names[model]} 3D model`;
    document.getElementById('modelName').textContent = `${names[model]} · iOS and Android`;
  </script>
</body>
</html>
