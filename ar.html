<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open in AR</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #e9edf2; color: #374256; font-family: system-ui, sans-serif; text-align: center; }
    model-viewer { width: 100%; height: 100%; }
    model-viewer button { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); }
    button { padding: 14px 28px; border: 0; border-radius: 8px; color: #fff; background: #244f82; font-size: 1rem; font-weight: 650; }
  </style>
</head>
<body>
  <p id="status">Opening AR…</p>
  <button id="open">Open in AR</button>
  <script>
    // Standalone page. Put next to <Name>.glb + <Name>.usdz and open ar.html?model=<Name>.
    // Auto-opens Quick Look (iOS) right on page open, nothing else is downloaded.
    const params = new URLSearchParams(location.search);
    const model = params.get('model') || '';
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(navigator.userAgent);

    function openAR() {
      if (isIOS) {
        const link = document.createElement('a');
        link.rel = 'ar';
        link.href = new URL(`${model}.usdz`, location.href).href;
        link.appendChild(document.createElement('img')); // Safari needs an <img> inside to launch Quick Look
        document.body.appendChild(link);
        link.click();
        link.remove();
      }
    }

    // ponytail: temporary. Scene Viewer in the Google app closes right after launch
    // (google-ar/arcore-android-sdk#1795), so Android uses model-viewer: WebXR in Chrome, needs one tap.
    // Revert this commit to get the Scene Viewer auto-launch back once Google fixes it.
    function showModelViewer() {
      document.body.innerHTML = '<model-viewer ar camera-controls touch-action="pan-y" shadow-intensity="1">'
        + '<button slot="ar-button">Open in AR</button></model-viewer>';
      document.querySelector('model-viewer').src = `${model}.glb`;
      const script = document.createElement('script');
      script.type = 'module';
      script.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js';
      document.head.appendChild(script);
    }

    const status = document.getElementById('status');
    const button = document.getElementById('open');
    if (!/^[\w-]+$/.test(model)) { // plain file name only, no paths
      status.textContent = 'Add ?model=<Name> to the URL.';
      button.remove();
    } else if (!isIOS && !isAndroid) {
      status.textContent = 'Open this link on an iPhone, iPad or Android phone.';
      button.remove();
    } else if (isAndroid) {
      showModelViewer();
    } else {
      button.addEventListener('click', openAR);
      openAR();
    }
  </script>
</body>
</html>
