<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open in AR</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #e9edf2; color: #374256; font-family: system-ui, sans-serif; text-align: center; }
    button { padding: 14px 28px; border: 0; border-radius: 8px; color: #fff; background: #244f82; font-size: 1rem; font-weight: 650; }
  </style>
</head>
<body>
  <p id="status">Opening AR…</p>
  <button id="open">Open in AR</button>
  <script>
    // Standalone page. Put next to <Name>.glb + <Name>.usdz and open ar.html?model=<Name>.
    // Auto-opens Quick Look (iOS) / Scene Viewer (Android) right on page open, nothing else is downloaded.
    const params = new URLSearchParams(location.search);
    const model = params.get('model') || '';
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(navigator.userAgent);

    function openAR() {
      if (isIOS) {
        const link = document.createElement('a');
        link.rel = 'ar';
        link.href = new URL(`${model}.usdz`, location.href).href;
        link.appendChild(document.createElement('img')); // Safari needs an <img> inside to launch Quick Look
        document.body.appendChild(link);
        link.click();
        link.remove();
      } else if (isAndroid) {
        const back = new URLSearchParams(params);
        back.set('noar', '1'); // returning via fallback must not auto-launch again (loop)
        const file = encodeURIComponent(new URL(`${model}.glb`, location.href).href);
        const fallback = encodeURIComponent(`${location.origin}${location.pathname}?${back}`);
        location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${file}&mode=ar_preferred`
          + '#Intent;scheme=https;package=com.google.ar.core;' // ARCore hosts Scene Viewer; the Google app one crashes
          + `action=android.intent.action.VIEW;S.browser_fallback_url=${fallback};end;`;
      }
    }

    const status = document.getElementById('status');
    const button = document.getElementById('open');
    if (!/^[\w-]+$/.test(model)) { // plain file name only, no paths
      status.textContent = 'Add ?model=<Name> to the URL.';
      button.remove();
    } else if (!isIOS && !isAndroid) {
      status.textContent = 'Open this link on an iPhone, iPad or Android phone.';
      button.remove();
    } else {
      button.addEventListener('click', openAR);
      if (params.has('noar')) status.textContent = 'AR viewer is not available. Tap to try again.';
      else openAR();
    }
  </script>
</body>
</html>
