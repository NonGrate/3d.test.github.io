<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Open in AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #e9edf2; font-family: system-ui, sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    .ar-action { position: absolute; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      padding: 14px 28px; border: 0; border-radius: 8px; color: #fff; background: #244f82; font-size: 1rem; font-weight: 650; }
  </style>
</head>
<body>
  <model-viewer id="viewer" camera-controls touch-action="pan-y" autoplay ar ar-modes="scene-viewer quick-look" shadow-intensity="1" exposure="1">
    <button class="ar-action" slot="ar-button">Open in AR</button>
  </model-viewer>
  <script>
    // Standalone page. Put next to <Name>.glb + <Name>.usdz and open ar.html?model=<Name>.
    // Auto-opens Scene Viewer (Android) / Quick Look (iOS) immediately on page open:
    // browsers only allow it without a tap right after navigation, so don't wait for model-viewer to load.
    const params = new URLSearchParams(location.search);
    const model = params.get('model') || '';
    const viewer = document.getElementById('viewer');
    if (/^[\w-]+$/.test(model)) { // plain file name only, no paths
      viewer.src = `${model}.glb`;
      viewer.setAttribute('ios-src', `${model}.usdz`);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(navigator.userAgent);
      if (isIOS) {
        const link = document.createElement('a');
        link.rel = 'ar';
        link.href = new URL(`${model}.usdz`, location.href).href;
        link.appendChild(document.createElement('img')); // Safari needs an <img> inside to launch Quick Look
        document.body.appendChild(link);
        link.click();
        link.remove();
      } else if (isAndroid && !params.has('noar')) { // noar: came back via fallback, don't loop
        params.set('noar', '1');
        const file = encodeURIComponent(new URL(`${model}.glb`, location.href).href);
        const fallback = encodeURIComponent(`${location.origin}${location.pathname}?${params}`);
        location.href = `intent://arvr.google.com/scene-viewer/1.0?file=${file}&mode=ar_preferred`
          + '#Intent;scheme=https;package=com.google.android.googlequicksearchbox;'
          + `action=android.intent.action.VIEW;S.browser_fallback_url=${fallback};end;`;
      }
      // If the launch was blocked, the model preview and AR button stay on the page.
    } else {
      document.body.textContent = 'Add ?model=<Name> to the URL.';
    }
  </script>
</body>
</html>
