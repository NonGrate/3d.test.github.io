<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>AR.js Marker Tracking Test</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
</head>
<body class="ar-test-page">
  <div class="camera-message" id="cameraMessage" role="status">Allow camera access, then point at the Hiro marker.</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true; colorManagement: true"
    arjs="sourceType: webcam; facingMode: environment; debugUIEnabled: false; trackingMethod: best;">
    <a-marker id="hiroMarker" preset="hiro" smooth="true" smooth-count="8" smooth-tolerance="0.01" smooth-threshold="3">
      <a-entity id="modelEntity" animation-mixer></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>

  <div class="goggles-overlay" aria-hidden="true"><span></span></div>
  <header class="ar-topbar">
    <a href="index.html" id="modelBackLink" class="icon-action" aria-label="Back to model solutions">←</a>
    <div><strong>AR.js marker test</strong><small id="trackingState">Searching for marker…</small></div>
    <a class="marker-link" href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank" rel="noopener">Marker ↗</a>
  </header>

  <section class="story-panel" aria-label="AR information">
    <div class="story-meta"><span>Field notes</span><span data-page-count></span></div>
    <p data-page-text></p>
    <div class="story-actions">
      <button data-page-previous aria-label="Previous page">←</button>
      <button data-audio-restart>Play audio</button>
      <button data-page-next aria-label="Next page">→</button>
    </div>
  </section>

  <script>
    const models = {
      Shiba: { file: 'Shiba.glb', scale: '0.65 0.65 0.65', position: '0 0 0' },
      Island: { file: 'Island.glb', scale: '0.7 0.7 0.7', position: '0 0 0' },
      Solar_System_Animated_Rigged: { file: 'Solar_System_Animated_Rigged.glb', scale: '0.5 0.5 0.5', position: '0 0 0' }
    };
    const requested = new URLSearchParams(location.search).get('model');
    const selected = models[requested] || models.Shiba;
    const modelPages = { Shiba: 'shiba.html', Island: 'island.html', Solar_System_Animated_Rigged: 'solar-system.html' };
    document.getElementById('modelBackLink').href = modelPages[requested] || modelPages.Shiba;
    const entity = document.getElementById('modelEntity');
    entity.setAttribute('gltf-model', `url(${selected.file})`);
    entity.setAttribute('scale', selected.scale);
    entity.setAttribute('position', selected.position);

    const marker = document.getElementById('hiroMarker');
    const state = document.getElementById('trackingState');
    const message = document.getElementById('cameraMessage');
    marker.addEventListener('markerFound', () => {
      state.textContent = 'Marker tracked — move around it';
      message.hidden = true;
    });
    marker.addEventListener('markerLost', () => {
      state.textContent = 'Marker lost — point back at it';
      message.hidden = false;
    });
  </script>
  <script src="experience-ui.js"></script>
</body>
</html>
